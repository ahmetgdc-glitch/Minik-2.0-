.github/workflows/minik-pages.yml
name: MINIK online stellen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: minik-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Fertige App auspacken
        run: |
          unzip -q "MINIK_RELEASE_0.3.0.zip" 'dist/*' -d minik-release
          test -f minik-release/dist/index.html
          test -f minik-release/dist/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: minik-release/dist
      - name: App veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
