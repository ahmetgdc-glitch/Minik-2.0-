<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#78bdd7" />
  <title>MINIK reparieren</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4f9fc;color:#173746;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px;box-sizing:border-box;text-align:center}
    .card{max-width:520px;width:100%;background:white;border-radius:28px;padding:30px 22px;box-sizing:border-box;box-shadow:0 18px 48px rgba(34,75,96,.13)}
    .fish{font-size:58px}.spinner{width:34px;height:34px;border:4px solid #d8edf5;border-top-color:#287fa6;border-radius:50%;margin:20px auto;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:27px;margin:12px 0 10px}p{font-size:17px;line-height:1.45;margin:8px 0;color:#496470}
    #details{font-size:13px;color:#6d7d85;margin-top:16px;word-break:break-word}
    a{display:none;margin-top:20px;padding:14px 18px;border-radius:16px;background:#247fa7;color:white;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
<main><section class="card">
  <div class="fish" aria-hidden="true">🐟</div>
  <h1>MINIK wird repariert</h1>
  <p>Der alte iPhone-App-Cache wird entfernt. Profile und Lernfortschritt bleiben erhalten.</p>
  <div class="spinner" aria-hidden="true"></div>
  <p id="status">Alten MINIK-Cache entfernen …</p>
  <div id="details"></div>
  <a id="open" href="https://ahmetgdc-glitch.github.io/Minik-beta/?clean=external-rescue#/">MINIK öffnen</a>
</section></main>
<script>
(async function(){
  const status=document.getElementById('status');
  const details=document.getElementById('details');
  const open=document.getElementById('open');
  let removedWorkers=0, removedCaches=0;
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){
        const scope=String(reg.scope||'');
        if(scope.includes('/Minik-beta/')){
          try{if(await reg.unregister()) removedWorkers++;}catch(e){}
        }
      }
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const key of keys){
        if(key.startsWith('minik:') || key.toLowerCase().includes('minik-beta')){
          try{if(await caches.delete(key)) removedCaches++;}catch(e){}
        }
      }
    }
    status.textContent='Reparatur abgeschlossen. MINIK wird frisch geöffnet …';
    details.textContent=`Service Worker entfernt: ${removedWorkers} · Cache entfernt: ${removedCaches}`;
    open.style.display='inline-block';
    const target='https://ahmetgdc-glitch.github.io/Minik-beta/?clean='+Date.now()+'#/';
    open.href=target;
    setTimeout(()=>location.replace(target),900);
  }catch(error){
    status.textContent='Reparatur abgeschlossen. Bitte MINIK öffnen.';
    details.textContent=String(error&&error.message||error||'');
    open.style.display='inline-block';
  }
})();
</script>
</body>
</html>
